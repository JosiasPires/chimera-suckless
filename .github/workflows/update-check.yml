name: update-check

on:
  schedule:
    - cron: "0 6 * * 1" # segundas 06:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: host deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qy python3 git bubblewrap openssl ca-certificates

      - name: checkout cports
        uses: actions/checkout@v4
        with:
          repository: chimera-linux/cports
          path: cports

      - name: overlay templates
        run: cp -r overlay/cports/user/. cports/user/

      - name: check for new versions
        id: check
        working-directory: cports
        run: |
          ./cbuild update-check user/neuipc user/neuwld user/neuswc \
            user/bswc user/mojito user/wawa user/hst user/pfetch \
            user/linux-tiny \
            > /tmp/updates.txt 2>&1 || true
          cat /tmp/updates.txt
          {
            echo "report<<EOF"
            cat /tmp/updates.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: open issue on updates
        if: contains(steps.check.outputs.report, 'newer') || contains(steps.check.outputs.report, 'NEW')
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "cports: novas versoes disponiveis"
          content-filepath: /tmp/updates.txt
          labels: cports,automated
