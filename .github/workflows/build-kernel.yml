name: build-kernel

on:
  push:
    branches: [main]
    paths:
      - "cports/user/linux-tiny/**"
      - ".github/workflows/build-kernel.yml"
  workflow_dispatch:

env:
  CPORTS_REF: master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: host deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qy python3 git bubblewrap openssl ca-certificates
          curl -fsSLO https://repo.chimera-linux.org/apk/latest/apk-x86_64.static
          chmod +x apk-x86_64.static
          sudo install -m755 apk-x86_64.static /usr/local/bin/apk
          apk --version

      - name: preflight namespaces
        run: |
          unshare -rm true && echo "user-ns OK"
          test -d /sys/fs/cgroup

      - name: checkout cports
        uses: actions/checkout@v4
        with:
          repository: chimera-linux/cports
          ref: ${{ env.CPORTS_REF }}
          path: cports

      - name: overlay templates
        run: cp -r overlay/cports/user/. cports/user/

      - name: signing key (CI)
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          mkdir -p cports/etc/keys
          printf '%s' "$APK_SIGN_KEY" > cports/etc/keys/ci.rsa
          chmod 600 cports/etc/keys/ci.rsa
          openssl rsa -in cports/etc/keys/ci.rsa -pubout \
            -out cports/etc/keys/ci.rsa.pub
          # cbuild so conhece a chave via [signing] no config.ini
          printf '[signing]\nkey = etc/keys/ci.rsa\n' > cports/etc/config.ini

      - name: bootstrap
        working-directory: cports
        run: ./cbuild bootstrap

      - name: diagnose sysusers on failure
        if: failure()
        working-directory: cports
        run: |
          ls -la bldroot/etc/ | head -25
          ls bldroot/usr/lib/sysusers.d/ 2>&1
          /usr/bin/bwrap --unshare-all --hostname cbuild --share-net \
            --bind $PWD/bldroot / --dev /dev --proc /proc --tmpfs /tmp \
            --uid 1337 --gid 1337 --chdir / -- usr/bin/sd-sysusers
          echo "sd-sysusers rc=$?"

      - name: build tiny kernel
        working-directory: cports
        run: ./cbuild pkg user/linux-tiny

      - name: upload packages
        uses: actions/upload-artifact@v4
        with:
          name: apk-kernel
          path: cports/packages/
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: fetch artifacts
        uses: actions/download-artifact@v4
        with:
          name: apk-kernel
          path: repo
      - name: publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
          keep_files: true
