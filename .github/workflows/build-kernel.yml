name: build-kernel

on:
  push:
    branches: [main]
    paths:
      - "cports/user/linux-tiny/**"
      - ".github/workflows/build-kernel.yml"
  workflow_dispatch:

env:
  CPORTS_REF: master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: checkout overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: host deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qy python3 git bubblewrap openssl ca-certificates
          curl -fsSLO https://repo.chimera-linux.org/apk/latest/apk-x86_64.static
          chmod +x apk-x86_64.static
          sudo install -m755 apk-x86_64.static /usr/local/bin/apk
          apk --version
          # linter/formatter exigido pelo cbuild (auto = flake8 || ruff)
          curl -fsSL https://github.com/astral-sh/ruff/releases/latest/download/ruff-x86_64-unknown-linux-gnu.tar.gz -o ruff.tgz
          tar xzf ruff.tgz
          sudo install -m755 ruff-*/ruff /usr/local/bin/ruff
          ruff --version

      - name: preflight namespaces
        run: |
          unshare -rm true && echo "user-ns OK"
          test -d /sys/fs/cgroup

      - name: allow unprivileged userns (GH runners block it via AppArmor)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          unshare -rm true && echo "user-ns OK after toggle"

      - name: checkout cports
        uses: actions/checkout@v4
        with:
          repository: chimera-linux/cports
          ref: ${{ env.CPORTS_REF }}
          path: cports

      - name: overlay templates
        run: cp -r overlay/cports/user/. cports/user/

      - name: signing key (CI)
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          mkdir -p cports/etc/keys
          printf '%s' "$APK_SIGN_KEY" > cports/etc/keys/ci.rsa
          chmod 600 cports/etc/keys/ci.rsa
          openssl rsa -in cports/etc/keys/ci.rsa -pubout \
            -out cports/etc/keys/ci.rsa.pub
          # cbuild so conhece a chave via [signing] no config.ini
          printf '[signing]\nkey = etc/keys/ci.rsa\n' > cports/etc/config.ini

      - name: bootstrap
        working-directory: cports
        run: ./cbuild bootstrap

      - name: build tiny kernel
        working-directory: cports
        # -j3, nao -j4 (default=nproc): clang estoura os 16GB do runner
        # em pico e o OOM-killer derruba o build sem mensagem no log
        run: ./cbuild -j3 pkg user/linux-tiny

      - name: upload packages
        uses: actions/upload-artifact@v4
        with:
          name: apk-kernel
          path: cports/packages/
          retention-days: 90
