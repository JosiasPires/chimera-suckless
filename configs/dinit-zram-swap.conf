; zram nativo do dinit-chimera (substitui o bloco zram do /etc/rc.local).
; Ativar com: ln -sf /usr/lib/dinit.d/zram-device@zram0 /etc/dinit.d/boot.d/ (ou `dinitctl enable`)
; Equivale a ~50% da RAM com zstd, como swap com prioridade alta.
; Ref: https://github.com/chimera-linux/dinit-chimera (secao "Zram support")

[zram0]
size = (/ ram 2)
algorithm = zstd
format = mkswap -U clear %0
