; zram nativo do dinit-chimera (validado na VM).
; Uso: cp p/ /etc/dinit-zram.d/swap.conf, adicione a linha do fstab abaixo,
;   dinitctl enable zram-device@zram0 (+ reboot p/ validar o caminho completo).
;
; DESCOBERTAS (dinit-chimera atual):
; - O helper NÃO avalia expressões: `size = (/ ram 2)` e backticks passam
;   literais e falham. Use valor literal em bytes (calcule por máquina:
;   awk '/MemTotal/ {print int($2*1024/2)}' /proc/meminfo). 4294967296 = 4G.
; - O helper só FORMATA (mkswap); a ativação vem do fstab via early-swap:
;     /dev/zram0 none swap sw,pri=100 0 0
; - Requer no kernel: ZRAM + ZSMALLOC + backend (ex: ZRAM_BACKEND_ZSTD;
;   atenção: CRYPTO_ZSTD sozinho NÃO serve — zram usa backends próprios!).
;
; Ref: https://github.com/chimera-linux/dinit-chimera (secao "Zram support")

[zram0]
size = 4294967296
algorithm = zstd
format = mkswap -U clear %0
